version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"  # Astro server
      - "4321:4321"  # WebSocket server
    volumes:
      - ./data:/app/data  # Persist SQLite database
      - ./certs:/app/certs  # SSL certificates
      - ./.env.production:/app/.env  # Environment variables
    env_file:
      - .env.production
    tty: true
    stdin_open: true
    restart: unless-stopped
